server:
  port: 8080
spring:
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/importastock}
app:
  cors-origins: http://localhost:4200
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:importastock;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USER:importastock}
    password: ${ORACLE_PASSWORD:importastock}
